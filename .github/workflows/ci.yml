name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read

jobs:
  test:
    name: Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    services:
      neo4j:
        image: neo4j:5.26.33-community
        env:
          NEO4J_AUTH: neo4j/ci-graph-password
        ports:
          - 7687:7687
        options: >-
          --health-cmd "cypher-shell -u neo4j -p ci-graph-password 'RETURN 1'"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 10
    env:
      NEO4J_TESTS: 'true'
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ci-graph-password

    strategy:
      matrix:
        node-version: ["24"]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test
